<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | FoodNest</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

</head>

<body>

<header>

    <div class="logo">
        <i class="fa-solid fa-burger"></i>
        <h2>FoodNest</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="restaurant.html">Restaurants</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html" class="active">Cart</a>
    </nav>

    <button class="login-btn">Login</button>

</header>

<section class="cart-banner">

    <h1>Your Cart</h1>

    <p>Review your selected items before checkout.</p>

</section>

<section class="cart-container">

    <div class="cart-items">

        <div class="cart-card">

            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">

            <div class="cart-info">

                <h3>Cheese Burger</h3>

                <p>₹199</p>

                <div class="quantity">

                    <button>-</button>

                    <span>1</span>

                    <button>+</button>

                </div>
                <button class="remove-btn">
    Remove
</button>

            </div>

        </div>

        <div class="cart-card">

            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500">

            <div class="cart-info">

                <h3>Farmhouse Pizza</h3>

                <p>₹299</p>

                <div class="quantity">

                    <button>-</button>

                    <span>1</span>

                    <button>+</button>

                </div>
                  <button class="remove-btn">
    Remove
</button>

            </div>

        </div>

    </div>

    <div class="summary">

        <h2>Order Summary</h2>

        <p>Items : ₹498</p>

        <p>Delivery : ₹40</p>

        <h3>Total : ₹538</h3>

        <button class="checkout-btn">

            Proceed to Checkout

        </button>

    </div>

</section>

<footer>

<h2>FoodNest</h2>

<p>Fresh Food • Fast Delivery</p>

<p>© 2026 FoodNest</p>

</footer>

<script src="js/cart.js"></script>

</body>

</html>
